<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JARVIS</title>
<style>
:root{
  --bg:#050b14; --panel:#0d1a2b; --line:#1c3552; --text:#e6f4ff; --dim:#8aa6c1;
  --cyan:#38d6ff; --amber:#ffb347; --red:#ff6b6b;
  --pt:env(safe-area-inset-top,0px); --pb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;padding-top:var(--pt);padding-bottom:var(--pb);overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px}
header h1{font-size:18px;font-weight:600;letter-spacing:.2em;margin:0;color:var(--cyan)}
.iconbtn{background:none;border:1px solid var(--line);color:var(--text);border-radius:12px;
  padding:8px 14px;font-size:14px}
#log{flex:1;overflow-y:auto;padding:8px 18px 12px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 14px;border-radius:16px;font-size:16px;line-height:1.45;
  background:var(--panel);border:1px solid var(--line);white-space:pre-wrap}
.msg.user{align-self:flex-end;background:#0f2a44;border-color:#24507a}
.msg.sys{align-self:center;color:var(--dim);font-size:14px;background:none;border:none;text-align:center}
.stage{display:flex;flex-direction:column;align-items:center;gap:10px;padding:6px 18px 10px}
#orb{width:112px;height:112px;border-radius:50%;border:none;cursor:pointer;
  background:radial-gradient(circle at 50% 40%,#bff3ff 0,var(--cyan) 28%,#0b5d82 62%,#06223a 100%);
  box-shadow:0 0 28px 6px rgba(56,214,255,.35),inset 0 0 22px rgba(255,255,255,.25);
  transition:box-shadow .2s,transform .2s}
#orb:active{transform:scale(.96)}
body[data-state="listening"] #orb{
  background:radial-gradient(circle at 50% 40%,#fff1d6 0,var(--amber) 30%,#8a4b0a 65%,#2d1604 100%);
  box-shadow:0 0 34px 10px rgba(255,179,71,.5);animation:pulse 1.1s ease-in-out infinite}
body[data-state="thinking"] #orb{animation:spin 1.4s linear infinite;
  box-shadow:0 0 30px 8px rgba(56,214,255,.5);
  background:conic-gradient(from 0deg,#38d6ff,#06223a,#38d6ff)}
body[data-state="speaking"] #orb{animation:pulse .7s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#orb{animation:none!important}}
#status{font-size:14px;color:var(--dim);min-height:20px}
.row{display:flex;gap:8px;width:100%;max-width:560px}
.row input{flex:1;min-width:0}
input[type=text],input[type=password]{background:var(--panel);border:1px solid var(--line);color:var(--text);
  border-radius:12px;padding:12px 14px;font-size:16px;width:100%}
input:focus-visible,button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.send{background:var(--cyan);color:#04202e;border:none;border-radius:12px;padding:0 18px;font-size:16px;font-weight:600}
#settings{position:fixed;inset:0;background:rgba(3,8,14,.96);padding:calc(var(--pt) + 20px) 20px 20px;
  overflow-y:auto;display:none;z-index:5}
#settings.open{display:block}
#settings h2{margin:0 0 4px;font-size:20px}
#settings p{color:var(--dim);font-size:14px;line-height:1.45;margin:6px 0 14px}
label{display:block;font-size:14px;color:var(--dim);margin:14px 0 6px}
.check{display:flex;align-items:center;gap:10px;margin:16px 0;font-size:16px}
.check input{width:22px;height:22px}
.actions{display:flex;gap:10px;margin-top:20px}
.actions button{flex:1;padding:13px;border-radius:12px;font-size:16px;border:1px solid var(--line);
  background:var(--panel);color:var(--text)}
.actions .primary{background:var(--cyan);color:#04202e;border:none;font-weight:600}
</style>
</head>
<body data-state="idle">
<header>
  <h1>J.A.R.V.I.S</h1>
  <button class="iconbtn" id="openSettings">Ajustes</button>
</header>

<div id="log" aria-live="polite"></div>

<div class="stage">
  <button id="orb" aria-label="Hablar"></button>
  <div id="status">Toca la esfera y habla</div>
  <div class="row">
    <input type="text" id="txt" placeholder="O escribe aquí" autocomplete="off">
    <button class="send" id="send">Enviar</button>
  </div>
</div>

<div id="settings" role="dialog" aria-label="Ajustes">
  <h2>Ajustes</h2>
  <p>Las llaves se guardan solo en este teléfono, en este navegador. No se envían a nadie más que a Groq y a Fish Audio.</p>
  <label for="kGroq">Llave de Groq (empieza con gsk_)</label>
  <input type="password" id="kGroq" autocomplete="off" autocapitalize="off" spellcheck="false">
  <label for="kFish">Llave de Fish Audio</label>
  <input type="password" id="kFish" autocomplete="off" autocapitalize="off" spellcheck="false">
  <label for="vFish">ID de voz de Fish Audio (opcional)</label>
  <input type="text" id="vFish" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Déjalo vacío para la voz por defecto">
  <div class="check"><input type="checkbox" id="useFish" checked><label for="useFish" style="margin:0;color:var(--text)">Usar la voz de Fish Audio (si falla, uso la del navegador)</label></div>
  <div class="actions">
    <button id="clearChat">Borrar charla</button>
    <button class="primary" id="saveSettings">Guardar</button>
  </div>
</div>

<script>
(function(){
  var $ = function(id){return document.getElementById(id)};
  var log=$('log'), statusEl=$('status'), orb=$('orb');
  var SYSTEM = "Eres JARVIS, un asistente de voz amable y eficiente. Respondes siempre en español, "
    + "en frases cortas y naturales (máximo 3 oraciones), sin listas, sin markdown y sin emojis, "
    + "porque tu respuesta se leerá en voz alta.";
  var history = [];
  var busy = false, recorder = null, chunks = [], stream = null;

  function load(k){ try{ return localStorage.getItem(k)||''; }catch(e){ return ''; } }
  function save(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  var cfg = {
    groq: load('jv_groq'), fish: load('jv_fish'), voice: load('jv_voice'),
    useFish: load('jv_usefish') !== '0'
  };

  function setState(s, text){ document.body.dataset.state = s; statusEl.textContent = text || ''; }
  function add(role, text){
    var d = document.createElement('div');
    d.className = 'msg ' + role; d.textContent = text; log.appendChild(d);
    log.scrollTop = log.scrollHeight; return d;
  }
  function needKeys(){
    if(!cfg.groq){ add('sys','Falta tu llave de Groq. Ábrela en Ajustes.'); return true; }
    return false;
  }

  /* ---------- Ajustes ---------- */
  $('openSettings').onclick = function(){
    $('kGroq').value = cfg.groq; $('kFish').value = cfg.fish; $('vFish').value = cfg.voice;
    $('useFish').checked = cfg.useFish; $('settings').classList.add('open');
  };
  $('saveSettings').onclick = function(){
    cfg.groq = $('kGroq').value.trim(); cfg.fish = $('kFish').value.trim();
    cfg.voice = $('vFish').value.trim(); cfg.useFish = $('useFish').checked;
    save('jv_groq',cfg.groq); save('jv_fish',cfg.fish); save('jv_voice',cfg.voice);
    save('jv_usefish', cfg.useFish ? '1':'0');
    $('settings').classList.remove('open');
  };
  $('clearChat').onclick = function(){ history=[]; log.innerHTML=''; $('settings').classList.remove('open'); };

  /* ---------- Grabar voz ---------- */
  orb.onclick = function(){
    if(busy) return;
    if(recorder && recorder.state === 'recording'){ recorder.stop(); return; }
    startRec();
  };
  function startRec(){
    if(needKeys()) return;
    if(!navigator.mediaDevices || !window.MediaRecorder){
      add('sys','Este navegador no permite grabar. Puedes escribir tu mensaje abajo.'); return;
    }
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){
      stream = s; chunks = [];
      recorder = new MediaRecorder(s);
      recorder.ondataavailable = function(e){ if(e.data && e.data.size) chunks.push(e.data); };
      recorder.onstop = function(){
        s.getTracks().forEach(function(t){t.stop();});
        var blob = new Blob(chunks, {type: recorder.mimeType || 'audio/webm'});
        if(blob.size < 1500){ setState('idle','No te escuché. Toca y habla de nuevo.'); return; }
        transcribe(blob);
      };
      recorder.start();
      setState('listening','Te escucho… toca otra vez para terminar');
    }).catch(function(e){
      var n = (e && e.name) ? e.name : 'desconocido';
      var hint = 'Revisa el permiso del navegador para esta página.';
      if(n === 'NotAllowedError') hint = 'El permiso del micrófono fue rechazado (por el sitio o por Android).';
      else if(n === 'NotFoundError') hint = 'No se encontró ningún micrófono.';
      else if(n === 'NotReadableError') hint = 'Otra app está usando el micrófono.';
      else if(n === 'SecurityError') hint = 'El navegador bloquea el micrófono en este tipo de dirección.';
      add('sys','No pude usar el micrófono (' + n + '). ' + hint);
      setState('idle','Toca la esfera y habla');
    });
  }

  function transcribe(blob){
    busy = true; setState('thinking','Entendiendo lo que dijiste…');
    var ext = blob.type.indexOf('mp4')>-1 ? 'm4a' : blob.type.indexOf('ogg')>-1 ? 'ogg' : 'webm';
    var fd = new FormData();
    fd.append('file', blob, 'voz.'+ext);
    fd.append('model','whisper-large-v3-turbo');
    fd.append('language','es');
    fd.append('response_format','json');
    fetch('https://api.groq.com/openai/v1/audio/transcriptions',{
      method:'POST', headers:{Authorization:'Bearer '+cfg.groq}, body:fd
    }).then(checkOk).then(function(r){return r.json();}).then(function(j){
      var t = (j.text||'').trim();
      if(!t){ busy=false; setState('idle','No entendí nada. Intenta otra vez.'); return; }
      ask(t);
    }).catch(fail('la transcripción'));
  }

  /* ---------- Pensar ---------- */
  function ask(text){
    if(needKeys()) return;
    busy = true;
    add('user', text); history.push({role:'user',content:text});
    if(history.length > 16) history = history.slice(-16);
    setState('thinking','Pensando…');
    fetch('https://api.groq.com/openai/v1/chat/completions',{
      method:'POST',
      headers:{Authorization:'Bearer '+cfg.groq,'Content-Type':'application/json'},
      body: JSON.stringify({
        model:'openai/gpt-oss-20b',
        messages:[{role:'system',content:SYSTEM}].concat(history),
        max_completion_tokens:600,
        reasoning_effort:'low'
      })
    }).then(checkOk).then(function(r){return r.json();}).then(function(j){
      var a = (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content || '').trim();
      if(!a) a = 'No tengo respuesta para eso.';
      history.push({role:'assistant',content:a});
      add('bot', a);
      speak(a);
    }).catch(fail('la respuesta'));
  }

  /* ---------- Hablar ---------- */
  function clean(t){
    return t.replace(/[*_`#>~]/g,'').replace(/\[(.*?)\]\(.*?\)/g,'$1').replace(/\s+/g,' ').trim();
  }
  function speak(text){
    text = clean(text);
    if(cfg.useFish && cfg.fish){
      setState('speaking','Hablando…');
      var body = {text:text, format:'mp3'};
      if(cfg.voice) body.reference_id = cfg.voice;
      fetch('https://api.fish.audio/v1/tts',{
        method:'POST',
        headers:{Authorization:'Bearer '+cfg.fish,'Content-Type':'application/json'},
        body: JSON.stringify(body)
      }).then(checkOk).then(function(r){return r.blob();}).then(function(b){
        var a = new Audio(URL.createObjectURL(b));
        a.onended = done; a.onerror = function(){ browserVoice(text); };
        return a.play();
      }).catch(function(e){
        var why;
        if(e && e.status){
          why = 'Fish respondió con error ' + e.status;
          var b = (e.body || '').replace(/\s+/g,' ').slice(0,160);
          if(b) why += ': ' + b;
        } else if(e && e.name === 'NotAllowedError'){
          why = 'El navegador bloqueó el audio; toca la pantalla y prueba de nuevo';
        } else {
          why = 'No se pudo conectar con Fish (probable bloqueo del navegador para este tipo de página)';
        }
        add('sys', why + '. Uso la voz del navegador.');
        browserVoice(text);
      });
    } else { browserVoice(text); }
  }
  function browserVoice(text){
    if(!window.speechSynthesis){ done(); return; }
    setState('speaking','Hablando…');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'es-ES';
    var vs = speechSynthesis.getVoices().filter(function(v){return /^es/i.test(v.lang);});
    if(vs.length) u.voice = vs[0];
    u.onend = done; u.onerror = done;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }
  function done(){ busy=false; setState('idle','Toca la esfera y habla'); }

  /* ---------- Utilidades ---------- */
  function checkOk(r){
    if(r.ok) return r;
    return r.text().then(function(t){
      var e = new Error('HTTP '+r.status); e.status = r.status; e.body = t; throw e;
    });
  }
  function fail(what){
    return function(e){
      busy = false;
      var m = 'No pude completar ' + what + '. ';
      if(e && e.status === 401) m += 'La llave no es válida; revísala en Ajustes.';
      else if(e && e.status === 429) m += 'Llegaste al límite gratis por ahora; espera un minuto.';
      else if(e && e.status) m += 'El servicio respondió con error ' + e.status + '.';
      else m += 'Parece un problema de conexión o de permisos del navegador.';
      add('sys', m); setState('idle','Toca la esfera y habla');
    };
  }

  /* ---------- Texto ---------- */
  function sendText(){
    var t = $('txt').value.trim();
    if(!t || busy) return;
    $('txt').value = ''; ask(t);
  }
  $('send').onclick = sendText;
  $('txt').addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); sendText(); } });

  if(window.speechSynthesis){ speechSynthesis.getVoices(); }
  if(!cfg.groq){ add('sys','Bienvenido. Abre Ajustes y pega tu llave de Groq para empezar.'); }
  else { add('sys','Listo. Toca la esfera y habla.'); }
})();
</script>
</body>
</html>
